# DevImage Nginx 源站参考（域名：devimg.cn / cdn.devimg.cn）
# 生产：复制到 /etc/nginx/sites-available/devimg 并 ln -s 到 sites-enabled
# CDN 回源使用 HTTP:80；文档站 HTTPS 由 certbot 管理

upstream devimage_api {
    server 127.0.0.1:3010;
    keepalive 32;
}

# CDN 回源（边缘 HTTPS 在腾讯云 CDN）
server {
    listen 80;
    listen [::]:80;
    server_name cdn.devimg.cn;

    client_max_body_size 1m;

    location / {
        proxy_pass http://devimage_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 文档站（certbot 会追加 443 与跳转）
server {
    listen 80;
    listen [::]:80;
    server_name devimg.cn www.devimg.cn;

    root /home/ht/devimg/apps/docs/.vitepress/dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
